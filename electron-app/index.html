<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:; connect-src * ws: wss:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com;" />
  <title>Unme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== TELA 1: LOBBY (entrar na sala) ===================== -->
  <main id="lobby-screen" class="screen">
    <section class="lobby-card">
      <div class="lobby-mark" aria-hidden="true">
        <span class="dot dot-a"></span>
        <span class="dot dot-b"></span>
      </div>
      <h1 class="lobby-title">Unme</h1>
      <p class="lobby-subtitle">Apenas dois. Entre na sua sala privada.</p>

      <div class="lobby-actions">
        <button id="create-room-button" class="btn btn-primary" type="button">
          Criar sala
        </button>
        <button id="show-join-button" class="btn btn-secondary" type="button">
          Entrar em uma sala
        </button>
      </div>

      <form id="join-form" class="lobby-form" hidden>
        <label for="room-input" class="sr-only">Nome da sala</label>
        <input
          id="room-input"
          class="room-input"
          type="text"
          placeholder="nome-da-sala"
          autocomplete="off"
          spellcheck="false"
          maxlength="40"
          required
        />
        <button id="join-button" class="btn btn-primary" type="submit">
          Entrar na sala
        </button>
        <button id="back-to-lobby-button" class="btn btn-secondary" type="button">
          Voltar
        </button>
      </form>

      <div id="created-room" class="created-room" hidden>
        <span class="created-room-label">Código da sala</span>
        <div class="created-room-row">
          <code id="created-room-code"></code>
          <button id="copy-room-button" class="btn btn-secondary" type="button">Copiar</button>
        </div>
      </div>

      <p id="lobby-status" class="lobby-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- ===================== TELA 2: CHAMADA ===================== -->
  <main id="call-screen" class="screen" hidden>
    <header class="call-header">
      <div class="room-badge">
        <span id="connection-dot" class="conn-dot conn-connecting"></span>
        <span id="room-label" class="room-label">sala</span>
      </div>
      <div class="active-room-code">
        <code id="active-room-code"></code>
        <button id="copy-active-room" type="button" aria-label="Copiar código da sala">Copiar</button>
      </div>
      <button id="open-settings" class="header-icon-button" type="button" aria-label="Abrir configurações">⚙</button>
      <span id="call-status" class="call-status">conectando...</span>
    </header>

    <section class="stage">
      <div class="video-tile video-tile-remote video-square" id="remote-tile">
        <div class="avatar" id="remote-avatar" aria-label="Avatar da outra pessoa">:)</div>
        <video id="remote-video" autoplay playsinline data-empty="true"></video>
        <audio id="remote-audio" autoplay></audio>
        <div class="tile-empty-state" id="remote-empty">
          <span>esperando a outra pessoa entrar...</span>
        </div>
        <span class="tile-label">user</span>
        <div class="video-actions">
          <button id="btn-fullscreen" type="button">Tela cheia</button>
        </div>
        <div id="remote-context-menu" class="context-menu" hidden>
          <button id="btn-remote-mute" type="button">Mutar live</button>
          <label class="context-volume" for="remote-volume">
            <span>Volume <output id="remote-volume-value">100%</output></span>
            <input id="remote-volume" type="range" min="0" max="200" value="100" step="1" />
          </label>
        </div>
      </div>

      <div class="video-tile video-tile-local video-square" id="local-tile">
        <div class="avatar" id="local-avatar" aria-label="Seu avatar">:)</div>
        <video id="local-video" autoplay playsinline muted></video>
        <span class="tile-label" id="local-tile-label">user</span>
      </div>
    </section>

    <footer class="controls-dock">
      <button id="btn-mute" class="dock-btn" type="button" aria-pressed="false" aria-label="Mutar microfone">
        <svg class="icon icon-mic-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon icon-mic-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V9m0-3a3 3 0 0 0-6 0v6c0 .4.06.78.17 1.14M19 11a7 7 0 0 1-1.68 4.56M12 18v3M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="dock-btn-label">mudo</span>
      </button>

      <button id="btn-camera" class="dock-btn" type="button" aria-pressed="false" aria-label="Desligar camera">
        <svg class="icon icon-cam-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h9A1.5 1.5 0 0 1 15 7.5v9A1.5 1.5 0 0 1 13.5 18h-9A1.5 1.5 0 0 1 3 16.5v-9Z" stroke="currentColor" stroke-width="1.8"/><path d="m15 10 5.15-3.09c.56-.34 1.28.07 1.28.72v8.74c0 .65-.72 1.06-1.28.72L15 14" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg class="icon icon-cam-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h6.79M15 8.62V7.5A1.5 1.5 0 0 0 13.5 6h-1M15 10l5.15-3.09c.56-.34 1.28.07 1.28.72v8.74c0 .65-.72 1.06-1.28.72L15 14m0 2.5A1.5 1.5 0 0 1 13.5 18h-9A1.5 1.5 0 0 1 3 16.5V9m18-6L3 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dock-btn-label">camera</span>
      </button>

      <button id="btn-share" class="dock-btn" type="button" aria-pressed="false" aria-label="Compartilhar tela">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M9 20h6M12 16.5V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m9.5 12 2-2 2 2M11.5 10v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dock-btn-label">tela</span>
      </button>

      <button id="btn-leave" class="dock-btn dock-btn-danger" type="button" aria-label="Sair da chamada">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 15v-2.2C4 8.6 7.6 5 12 5s8 3.6 8 7.8V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.5 14.2h3a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2v-1.3a.5.5 0 0 1 .5-.5ZM19.5 14.2h-3a1 1 0 0 0-1 1V18a1 1 0 0 0 1 1H18a2 2 0 0 0 2-2v-1.3a.5.5 0 0 0-.5-.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="dock-btn-label">sair</span>
      </button>
    </footer>
  </main>

  <!-- ===================== MODAL: escolher tela/janela para compartilhar ===================== -->
  <div id="source-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>Compartilhar tela</h2>
        <button id="source-modal-close" class="modal-close" type="button" aria-label="Fechar">×</button>
      </div>
      <label class="screen-audio-option">
        <input id="include-system-audio" type="checkbox" />
        <span>Compartilhar Áudio</span>
      </label>
      <div id="source-grid" class="source-grid"></div>
      <button id="stop-screen-share" class="stop-share-button" type="button" hidden>Parar compartilhamento</button>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay" hidden>
    <section class="modal-card settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">Configurações</h2>
        <button id="settings-close" class="modal-close" type="button" aria-label="Fechar">×</button>
      </div>
      <label class="settings-field" for="settings-microphone">
        <span>Microfone</span>
        <select id="settings-microphone"></select>
      </label>
      <label class="settings-field" for="settings-output">
        <span>Saída de áudio</span>
        <select id="settings-output"></select>
      </label>
      <label class="settings-field" for="settings-input-volume">
        <span>Volume de entrada <output id="settings-input-value">100%</output></span>
        <input id="settings-input-volume" type="range" min="0" max="200" value="100" step="1" />
      </label>
      <label class="settings-field" for="settings-output-volume">
        <span>Volume de saída <output id="settings-output-value">100%</output></span>
        <input id="settings-output-volume" type="range" min="0" max="200" value="100" step="1" />
      </label>
      <div class="settings-divider"></div>
      <label class="settings-toggle">
        <input id="settings-noise-suppression" type="checkbox" checked />
        <span>Redução de ruído</span>
      </label>
      <label class="settings-toggle">
        <input id="settings-echo-cancellation" type="checkbox" checked />
        <span>Cancelamento de eco</span>
      </label>
      <label class="settings-toggle">
        <input id="settings-auto-gain" type="checkbox" checked />
        <span>Ganho automático</span>
      </label>
    </section>
  </div>

  <!-- Toast de erro/aviso -->
  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="config.js"></script>
  <script src="media.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
