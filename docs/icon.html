<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ícone Unme — duas pessoas, uma conversa</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #10121b; color: #f5f2eb; font: 16px 'Segoe UI', sans-serif; }
    main { width: min(100%, 560px); text-align: center; }
    h1 { font-size: 28px; letter-spacing: -.8px; margin: 0 0 10px; }
    p { color: #b0b5c8; line-height: 1.6; }
    .preview { margin: 32px auto; padding: 24px; width: min(100%, 400px); border: 1px solid #363b50; border-radius: 24px; background: #1a1d2a; }
    #icon { display: block; width: 100%; height: auto; }
    .sizes { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 24px; }
    .sizes img { display: block; }
    button { padding: 15px 26px; border: 0; border-radius: 12px; background: #c4b4f7; color: #29203e; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #dfd4ff; }
    button:focus-visible { outline: 2px solid #8dd5b8; outline-offset: 4px; }
    small { display: block; margin-top: 16px; color: #858da8; }
  </style>
</head>
<body>
  <main>
    <h1>Duas pessoas. Uma conversa.</h1>
    <p>O novo símbolo do Unme: os dois pontos do <strong>ü</strong><br>representam quem está de cada lado da chamada.</p>
    <div class="preview">
      <canvas id="icon" width="1024" height="1024" aria-label="Marca Unme: ü. em um quadrado lilás"></canvas>
      <div class="sizes" aria-label="Prévia do ícone em tamanhos menores">
        <img width="16" height="16" alt="Ícone de 16 pixels">
        <img width="32" height="32" alt="Ícone de 32 pixels">
        <img width="64" height="64" alt="Ícone de 64 pixels">
      </div>
    </div>
    <button id="download" type="button">Baixar ícone PNG</button>
    <small>1024 × 1024 pixels · Cantos transparentes</small>
  </main>
  <script>
    const canvas = document.getElementById('icon');
    const context = canvas.getContext('2d');
    context.fillStyle = '#c4b4f7';
    context.beginPath();
    context.roundRect(0, 0, 1024, 1024, 341);
    context.fill();
    context.fillStyle = '#29203e';
    context.font = '700 654px "Segoe UI", sans-serif';
    const label = 'ü.';
    const metrics = context.measureText(label);
    const x = (1024 - metrics.width) / 2;
    const y = (1024 + metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
    context.fillText(label, x, y);
    const png = canvas.toDataURL('image/png');
    document.querySelectorAll('.sizes img').forEach((image) => { image.src = png; });
    document.getElementById('download').addEventListener('click', () => {
      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'unme-icon.png';
        link.href = url;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    });
  </script>
</body>
</html>
